name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ArcadeBedrockPillars
    steps:
      - name: Checkout addon
        uses: actions/checkout@v4
        with:
          path: ArcadeBedrockPillars

      # settings.gradle.kts uses includeBuild("../ArcadeCore"), so the
      # ArcadeCore build must sit next to the addon checkout.
      - name: Checkout ArcadeCore (composite build)
        uses: actions/checkout@v4
        with:
          repository: ArcadeCore/ArcadeCore
          path: ArcadeCore

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin jar
        run: chmod +x gradlew && ./gradlew build --no-daemon

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: ArcadeBedrockPillars
          path: ArcadeBedrockPillars/build/libs/*.jar
          if-no-files-found: error
