min-players: 1
max-players: 20

item-interval-seconds: 5

# MATERIAL or MATERIAL:amount (amount capped at the stack size). Blocks come as
# stacks so players can keep pillaring; no water/lava buckets (they cancel the lava).
items:
  - COBBLESTONE:32
  - OAK_PLANKS:32
  - DIRT:32
  - SANDSTONE:32
  - STONE_BRICKS:32
  - WHITE_WOOL:32
  - GLASS:16
  - NETHERRACK:32
  - COBWEB
  - SLIME_BLOCK:4
  - SCAFFOLDING:8
  - SNOWBALL
  - EGG
  - BOW
  - ARROW
  - SPLASH_POTION
  - SHIELD
  - ENDER_PEARL
  - GOLDEN_APPLE
  - TNT

# Spectator /bp chaos: drops a random item on a random alive player
chaos:
  cooldown-seconds: 20
  max-per-match: 10

# All player-facing text. MiniMessage format. Placeholders:
#   messages.chaos.cooldown: <seconds>
#   messages.chaos.broadcast: <spectator> <target>
messages:
  info: "<aqua><b>Bedrock Pillars</b></aqua> <gray>- /bp join | /bp leave"
  join:
    only-players: "<red>Only players can join the Bedrock Pillars queue."
    failed: "<red>Failed to join the queue."
    success: "<green>Joined the Bedrock Pillars queue."
  leave:
    only-players: "<red>Only players can leave the Bedrock Pillars queue."
    success: "<yellow>Left the Bedrock Pillars queue."
  chaos:
    not-player: "<red>Only spectators can cause chaos."
    must-spectate: "<red>You must be spectating a Bedrock Pillars match."
    cooldown: "<red>Chaos on cooldown: <seconds>s."
    match-cap: "<red>This match has had enough chaos."
    broadcast: "<light_purple><spectator> sent chaos to <target>!"
  debug:
    only-players: "<red>Only players can use debug commands."
    not-in-match: "<red>You are not in a Bedrock Pillars match."
    win: "<green>Debug: declared winner, match ended."
    lose: "<yellow>Debug: eliminated."
    end: "<yellow>Debug: match ended with no winners."
  queue:
    waiting-bossbar: "Waiting for players"
